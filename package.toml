gds = "implementation/gds/sky130_fd_sc_hd.gds"
layer_map = "implementation/gds/sky130A.map"
io_horizontal_layers = ["met3"]
io_vertical_layers = ["met2"]
routing_min_layer = "met1"
routing_max_layer = "met5"
tapcell_script = "implementation/tapcell.tcl"
pdn_script = "implementation/pdn.tcl"
fill_cells = ["sky130_fd_sc_hd__fill_8", "sky130_fd_sc_hd__fill_4", "sky130_fd_sc_hd__fill_2", "sky130_fd_sc_hd__fill_1"]
rcx_rules = "implementation/rcx/sky130_fd_sc_hd__nom.rules"

[pdk.implementation.liberty]
tt = ["implementation/lib/sky130_fd_sc_hd__tt_025C_1v80.lib"]

[pdk.simulation]
engine = "ngspice"
root = "libs.tech/ngspice"
model_file = "sky130.lib.spice"
section = "tt"
includes = []
options = [".option scale=1u"]
requires_osdi = false

[pdk.simulation.devices]
nmos = "sky130_fd_pr__nfet_01v8"
pmos = "sky130_fd_pr__pfet_01v8"

