[package]
schema_version = 1
name = "sky130"
version = "0.1.0"
description = "SkyWater SKY130 130 nm CMOS open-source PDK"
license = "Apache-2.0"

[source]
type = "git"
url = "https://github.com/google/skywater-pdk.git"
revision = "main"

[provides]
pdk = true
models = true
symbols = true
layout = true
verification = true
implementation = true

[trust]
trusted = false

[pdk]
display_name = "SkyWater SKY130"
default_schematic = "sky130_top"

id = "sky130A"
aliases = ["sky130", "sky130a"]

[pdk.implementation]
engine = "openroad"
synthesis = "yosys"
min_openroad = "2.0"
min_yosys = "0.40"
site = "unithd"
io_horizontal_layers = ["met3"]
io_vertical_layers = ["met2"]
routing_min_layer = "met1"
routing_max_layer = "met5"

[pdk.implementation.orfs]
platform = "sky130hd"
corner = "tt"
liberty_pattern = "tt_025C_1v80"

[pdk.simulation]
engine = "ngspice"
root = "libs.tech/ngspice"
model_file = "sky130.lib.spice"
section = "tt"
includes = []
options = [".option scale=1u"]
requires_osdi = false

[pdk.simulation.devices]
nmos = "sky130_fd_pr__nfet_01v8"
pmos = "sky130_fd_pr__pfet_01v8"

[[pdk.layer]]
name = "nwell.drawing"
number = 64
datatype = 20
minimum_width = 840

[[pdk.layer]]
name = "diff.drawing"
number = 65
datatype = 20
minimum_width = 150

[[pdk.layer]]
name = "poly.drawing"
number = 66
datatype = 20
minimum_width = 150

[[pdk.layer]]
name = "li1.drawing"
number = 67
datatype = 20
minimum_width = 170

[[pdk.layer]]
name = "met1.drawing"
number = 68
datatype = 20
minimum_width = 140

[[pdk.layer]]
name = "met2.drawing"
number = 69
datatype = 20
minimum_width = 140

[[pdk.layer]]
name = "met3.drawing"
number = 70
datatype = 20
minimum_width = 300

[[pdk.layer]]
name = "met4.drawing"
number = 71
datatype = 20
minimum_width = 300

[[pdk.layer]]
name = "met5.drawing"
number = 72
datatype = 20
minimum_width = 1600

[[pdk.layer]]
name = "capm.drawing"
number = 89
datatype = 44
minimum_width = 1000

[[pdk.layer]]
name = "cap2m.drawing"
number = 97
datatype = 44
minimum_width = 1000

[[pdk.layer]]
name = "pad.drawing"
number = 76
datatype = 20
minimum_width = 70000
